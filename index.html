<meta name="apple-mobile-web-app-title" content="BSEBC Choir">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --ink:#17203a; --paper:#eff0ec; --rule:#dcded7; --blue:#2c3e8f;
    --red:#9e3b2e; --gold:#c9a227; --muted:#6b7166; --faint:#8a9086;
    --nameW:152px; --tallyW:46px; --cell:34px; --songW:168px;
  }
  @media (min-width:900px){ :root{ --nameW:220px; --tallyW:62px; --cell:40px; --songW:280px; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--blue);text-decoration:none}
  a:hover{color:var(--ink)}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit;color:var(--ink)}
  .wrap{max-width:1200px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
  /* masthead */
  .mast{background:var(--ink);padding:14px 16px;display:flex;align-items:center;gap:11px}
  .logo{width:26px;height:32px;background:var(--paper);border-radius:13px 13px 2px 2px;position:relative;display:flex;align-items:center;justify-content:center;flex:none}
  .logo i{width:3px;height:15px;background:var(--ink);display:block}
  .logo b{width:11px;height:3px;background:var(--ink);position:absolute;top:11px}
  .brand{font-family:'Alice',serif;color:#fff;font-size:20px;line-height:1.1}
  .lang{margin-left:auto;display:flex;border:1px solid #3a4463;border-radius:999px;overflow:hidden}
  .lang button{padding:5px 11px;font-size:12px;font-weight:600;border:0;background:transparent;color:#9aa3bd;letter-spacing:.04em}
  .lang button.on{background:var(--gold);color:var(--ink)}
  .gold{height:2px;background:var(--gold)}
  .nav{display:flex;background:var(--ink);padding:0 8px}
  .nav a{padding:11px 12px;color:#9aa3bd;font-size:14px}
  .nav a.on{color:#fff;font-weight:600;border-bottom:3px solid var(--gold)}
  .nav .right{margin-left:auto}
  /* tabs + controls */
  .tabs{display:flex;background:#fff;border-bottom:1px solid var(--rule)}
  .tabs a{flex:1;padding:11px 0;text-align:center;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
  .tabs a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
  .ctrl{background:#fff;padding:12px 14px 14px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
  @media (min-width:900px){ .ctrl{flex-direction:row;align-items:center;flex-wrap:wrap;padding:16px 20px} }
  .dates{display:flex;align-items:center;gap:8px}
  .dates input{flex:1;min-width:0;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:15px;background:#fbfbf9;font-variant-numeric:tabular-nums}
  .chips{display:flex;gap:6px}
  .chips button{flex:1;padding:7px 10px;border-radius:999px;font-size:13px;border:1px solid var(--rule);background:var(--paper);color:#3c4438;white-space:nowrap}
  .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
  .seg button{flex:1;padding:8px 6px;font-size:14px;border:0;background:#fff;color:#3c4438;border-left:1px solid var(--rule)}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--blue);color:#fff;font-weight:600}
  .field{width:100%;border:1px solid var(--rule);border-radius:6px;padding:10px 11px;font-size:15px;background:#fbfbf9}
  /* grid */
  .scroll{overflow:auto;background:#fff;border-bottom:1px solid var(--rule)}
  .gwrap{min-width:max-content}
  .row{display:flex;min-width:100%}
  .spacer{width:calc(var(--nameW) + var(--tallyW));flex:none;position:sticky;left:0;z-index:3;background:#fff;border-right:2px solid var(--ink)}
  .hmonth{position:sticky;top:0;z-index:4}
  .hmonth .spacer{height:26px;background:#f4f5f1;border-bottom:1px solid var(--rule)}
  .hmonth .m{height:26px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Alice',serif;font-size:13px;background:#f4f5f1;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden}
  .hday{position:sticky;top:26px;z-index:4}
  .hday .spacer{height:40px;display:flex;align-items:center;padding:0 8px;font-family:'Alice',serif;font-size:13px;color:var(--muted);border-bottom:2px solid var(--ink)}
  .hday .d{width:var(--cell);flex:none;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#fff;border-right:1px solid var(--rule);border-bottom:2px solid var(--ink)}
  .hday .d.svc{background:#e7ebf5}
  .hday .d span{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .hday .d em{font-size:10px;font-style:normal;color:var(--muted);line-height:1}
  .hday .d.svc em{color:var(--blue)}
  .sect{display:flex;min-width:100%}
  .sect .lbl{width:calc(var(--nameW) + var(--tallyW));flex:none;position:sticky;left:0;z-index:3;background:var(--ink);color:var(--paper);height:28px;display:flex;align-items:center;padding:0 10px;font-family:'Alice',serif;font-size:12px;letter-spacing:.16em}
  .sect .fill{flex:1 0 auto;height:28px;background:var(--ink);color:#7c86a3;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font-size:11px}
  .name{width:var(--nameW);flex:none;height:var(--cell);position:sticky;left:0;z-index:2;background:#fff;display:flex;align-items:center;padding:0 8px;font-size:14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tally{width:var(--tallyW);flex:none;height:var(--cell);position:sticky;left:var(--nameW);z-index:2;background:#fbfbf9;display:flex;align-items:center;justify-content:center;font-size:14px;font-variant-numeric:tabular-nums;color:#3c4438;border-right:2px solid var(--ink);border-bottom:1px solid var(--rule)}
  .tally.low{color:var(--red)}
  .cell{width:var(--cell);flex:none;height:var(--cell);display:flex;align-items:center;justify-content:center;background:#fff;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:15px;font-weight:700;color:var(--red)}
  .cell.svc{background:#e7ebf5}
  .cell .sq{width:14px;height:14px;background:var(--ink)}
  .tail{flex:1 0 auto;background:#fff;border-bottom:1px solid var(--rule)}
  .srow .name,.srow .tally,.srow .cell{height:48px}
  .srow .name{width:var(--songW);flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;white-space:normal;line-height:1.15}
  .srow .tally{left:var(--songW)}
  .srow .spacer,.srow.hd .spacer{width:calc(var(--songW) + var(--tallyW))}
  .sub{font-size:11px;color:var(--faint);font-style:italic}
  .legend{padding:12px 14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12px;color:var(--muted)}
  .legend i{width:16px;height:16px;border:1px solid var(--rule);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:11px;color:var(--red)}
  /* lists */
  .sectbar{background:var(--ink);color:var(--paper);font-family:'Alice',serif;font-size:13px;letter-spacing:.14em;padding:7px 16px}
  .li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);background:#fff}
  .li.tap{min-height:58px;cursor:pointer;user-select:none}
  .li.off{background:#f7e9e6}
  .li .nm{font-size:17px}
  .li.off .nm{color:var(--red);font-weight:600}
  .pill{margin-left:auto;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--paper);color:var(--muted);min-width:86px;text-align:center}
  .li.off .pill{background:var(--red);color:#fff}
  .bar{flex:1;height:8px;background:var(--paper);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue)}
  .pct{width:52px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .box{width:26px;height:26px;flex:none;border-radius:5px;border:1px solid #b9bdb2;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
  .li.on .box{background:var(--blue);border-color:var(--blue)}
  .li.on{background:#f2f4fb}
  .mini{border:1px solid var(--rule);border-radius:6px;padding:8px 12px;font-size:14px;color:var(--blue);font-weight:600;background:#fff}
  .mini.danger{border-color:#e2cdc8;color:var(--red)}
  .btn{display:block;width:100%;background:var(--ink);color:#fff;text-align:center;font-size:17px;font-weight:600;padding:15px 0;border-radius:8px;border:0}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .pad{padding:16px}
  .note{padding:14px 16px 24px;font-size:13px;color:var(--muted);text-wrap:pretty}
  .h{font-family:'Alice',serif;font-size:17px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:8px}
  .h .n{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
  .step{font-family:'Alice',serif;font-size:15px;color:#3c4438;letter-spacing:.06em}
  .card{background:#fff;padding:16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border:1px solid var(--rule);border-radius:8px;background:#fff;cursor:pointer}
  .opt.on{border:2px solid var(--ink);background:#f2f4fb}
  .opt .dot{width:18px;height:18px;flex:none;border-radius:50%;border:1px solid #b9bdb2;background:#fff}
  .opt.on .dot{border:5px solid var(--blue)}
  .opt .tag{margin-left:auto;font-size:12px;color:var(--muted);background:var(--paper);border-radius:999px;padding:3px 9px}
  .tabbar{display:flex;background:#fff;border-top:1px solid var(--rule);position:sticky;bottom:0}
  .tabbar a{flex:1;text-align:center;padding:15px 2px;font-size:13px;color:var(--faint);border-top:3px solid transparent}
  .tabbar a.on{color:var(--ink);font-weight:600;border-top-color:var(--ink);background:#f4f5f1}
  .body{flex:1}
  .msg{padding:20px 16px;color:var(--muted);font-size:15px}
  .err{color:var(--red)}
  .svc-card{background:#fff;border-bottom:1px solid var(--rule);padding:13px 16px;display:flex;flex-direction:column;gap:8px}
  .svc-card .top{display:flex;align-items:baseline;gap:10px}
  .svc-card .date{font-family:'Alice',serif;font-size:17px}
  .svc-card .kind{font-size:12px;color:var(--blue);border:1px solid #c6cde6;background:#f2f4fb;border-radius:999px;padding:3px 9px}
  .svc-card .s{font-size:15px;color:#3c4438;padding-left:14px;border-left:2px solid var(--rule)}
  .login{padding:44px 26px;display:flex;flex-direction:column;gap:16px;max-width:420px;margin:0 auto;width:100%}
  .login label{font-family:'Alice',serif;font-size:14px;color:#3c4438;letter-spacing:.06em}
  .login input{width:100%;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:14px 13px;font-size:16px}
</style>
</head>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://qynprpimmjansluhuoez.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5bnBycGltbWphbnNsdWh1b2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjc4NzQsImV4cCI6MjEwMDc0Mzg3NH0.dJNRtomDs8bpqleXRmZZB0JG04M3l8MiAi1pTHuxYME';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- i18n ---------- */
const STR = {
  en:{attendance:'Attendance',songs:'Songs',signin:'Sign in',signout:'Sign out',grid:'Grid',summary:'Summary',

  ru:{attendance:'Посещаемость',songs:'Песни',signin:'Вход',signout:'Выйти',grid:'Сетка',summary:'Сводка',

    singer:'Хорист',song:'Песня',times:'Всего',last:'Последний',present:'был',absent:'не был',service:'служение',
    sung:'пели в это служение',labels:'Ут — утреннее · Вч — вечернее · Сп — спевка',
    admin:'Админка',songList:'Список песен',members:'Состав',whoCame:'Кто был',absentN:'отсутствуют',whatSang:'Что пели',selected:'выбрано',
    autosave:'Изменения сохраняются сразу — кнопки «Сохранить» нет.',done:'Готово',date:'1 · ДАТА',event:'2 · СОБЫТИЕ',
    rehearsal:'Спевка',morning:'Воскресное утреннее',evening:'Воскресное вечернее',other:'Другое событие',
    eventName:'Название события',shortLabel:'Метка',labelHint:'Короткая метка показывается под датой в сетке — 1–2 буквы.',
    markAtt:'Отметить посещаемость →',chooseSongs:'Выбрать песни →',recent:'ПОСЛЕДНИЕ ЗАПИСИ',edit:'Изм.',del:'Удал.',
    add:'Добавить',fullName:'Имя и фамилия',voicePart:'Партия',songTitle:'Название песни',subtitle:'Подзаголовок',
    search:'Поиск…',email:'Эл. почта',password:'Пароль',loginNote:'Доступ только у регента. Просмотр журнала — без входа.',
    loading:'Загрузка…',noEvents:'В этом периоде событий нет.',noSongs:'Записей пока нет.',
    deleteSinger:'Удалить хориста? Прошлые отметки останутся в журнале.',deleteSong:'Удалить песню? История служений сохранится.',
    renameSinger:'Имя',renameSong:'Название',soprano:'СОПРАНО',alto:'АЛЬТ',tenor:'ТЕНОР',bass:'БАС',
    singersN:n=>n+' чел.',songsN:n=>n+' песен',sungN:(n,d)=>'спето '+n+' · посл. '+(d||'—'),wasPresent:'Был',wasAbsent:'Не был'}
};
const MON = { en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
              ru:['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'] };
const MONF = { en:['January','February','March','April','May','June','July','August','September','October','November','December'],
               ru:['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'] };
const PARTS = ['soprano','alto','tenor','bass'];
const KIND_LABEL = { en:{rehearsal:'R',morning:'M',evening:'E'}, ru:{rehearsal:'Сп',morning:'Ут',evening:'Вч'} };

const S = {
  lang: localStorage.getItem('bsebc-lang') || 'en',
  session: null,
  route: location.hash || '#/attendance',
  loading: true,
  error: '',
  singers: [], songs: [], events: [], absences: [], eventSongs: [],
  from: null, to: null,           // public grid range
  sumFrom: null, sumTo: null,     // summary range
  typeFilter: 'all',
  query: '',
  draft: { date: today(), kind: 'morning', name: '', label: '' }
};
const t = k => { const v = STR[S.lang][k]; return typeof v === 'function' ? v : v; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dates ---------- */
function today(){ return new Date().toISOString().slice(0,10); }
function shift(months){ const d = new Date(); d.setMonth(d.getMonth() - months); return d.toISOString().slice(0,10); }
function fmtLong(iso){ const [y,m,d] = iso.split('-').map(Number);
  return S.lang === 'en' ? MONF.en[m-1] + ' ' + d + ', ' + y : d + ' ' + MONF.ru[m-1] + ' ' + y; }
function fmtShort(iso){ const [y,m,d] = iso.split('-');
  return S.lang === 'en' ? m + '/' + d + '/' + y.slice(2) : d + '.' + m + '.' + y.slice(2); }
function monthKey(iso){ const [y,m] = iso.split('-').map(Number); return MON[S.lang][m-1] + ' ' + String(y).slice(2); }

/* ---------- data ---------- */
async function load(){
  S.loading = true; render();
  const [si, so, ev, ab, es] = await Promise.all([
    sb.from('singers').select('*').order('part').order('sort_order'),
    sb.from('songs').select('*').order('title'),
    sb.from('events').select('*').order('date'),
    sb.from('absences').select('*'),
    sb.from('event_songs').select('*')
  ]);
  const err = [si,so,ev,ab,es].find(r => r.error);
  S.error = err ? err.error.message : '';
  S.singers = si.data || []; S.songs = so.data || []; S.events = ev.data || [];
  S.absences = ab.data || []; S.eventSongs = es.data || [];
  S.loading = false; render();
}

const isAbsent = (e,s) => S.absences.some(a => a.event_id === e && a.singer_id === s);
const wasSung  = (e,s) => S.eventSongs.some(x => x.event_id === e && x.song_id === s);
const inRange  = (d,a,b) => d >= a && d <= b;

function gridEvents(){
  return S.events.filter(e => inRange(e.date, S.from, S.to))
    .filter(e => S.typeFilter === 'all' ? true
      : S.typeFilter === 'services' ? e.kind !== 'rehearsal' : e.kind === 'rehearsal');
}
function songStats(id){
  const rows = S.eventSongs.filter(x => x.song_id === id);
  const dates = rows.map(r => (S.events.find(e => e.id === r.event_id) || {}).date).filter(Boolean).sort();
  return { n: rows.length, last: dates.length ? fmtShort(dates[dates.length-1]) : '' };
}

/* ---------- chrome ---------- */
function mast(){
  return `<div class="mast">
    <div class="logo"><i></i><b></b></div>
    <div class="brand">BSEBC Choir</div>
    <div class="lang">
      <button data-lang="en" class="${S.lang==='en'?'on':''}">EN</button>
      <button data-lang="ru" class="${S.lang==='ru'?'on':''}">RU</button>
    </div>
  </div><div class="gold"></div>`;
}
function publicNav(active){
  const right = S.session
    ? `<a href="#/attendance" class="right" data-signout>${esc(t('signout'))}</a>`
    : `<a href="#/login" class="right">${esc(t('signin'))}</a>`;
  const adminTab = S.session
    ? `<a href="#/admin/attendance" class="${active==='admin'?'on':''}">${esc(t('admin'))}</a>` : '';
  return `<div class="nav">
    <a href="#/attendance" class="${active==='att'?'on':''}">${esc(t('attendance'))}</a>
    <a href="#/songs" class="${active==='songs'?'on':''}">${esc(t('songs'))}</a>
    ${adminTab}${right}
  </div>`;
}
function adminBar(active){
  const i = (href,key,name) => `<a href="${href}" class="${active===key?'on':''}">${esc(t(name))}</a>`;
  return `<div class="tabbar">
    ${i('#/admin/attendance','att','attendance')}

function rangeCtrl(kind){
  const from = kind==='sum' ? S.sumFrom : S.from, to = kind==='sum' ? S.sumTo : S.to;
  const presets = kind==='sum'
    ? [['3',t('m3')],['6',t('m6')],['12',t('year')],['all',t('all')]]

    <div class="dates">

/* ---------- public: attendance ---------- */
function attendanceGrid(){
  const ev = gridEvents();
  const months = [];
  ev.forEach(e => { const k = monthKey(e.date); const last = months[months.length-1];
    if (last && last.k === k) last.n++; else months.push({k, n:1}); });
  const head = `<div class="row hmonth"><div class="spacer"></div>${
      months.map(m => `<div class="m" style="width:calc(var(--cell) * ${m.n})">${esc(m.k)}</div>`).join('')
    }<div class="tail" style="height:26px;background:#f4f5f1"></div></div>
    <div class="row hday"><div class="spacer">${esc(t('singer'))}</div>${
      ev.map(e => `<div class="d ${e.kind!=='rehearsal'?'svc':''}"><span>${+e.date.slice(8,10)}</span><em>${esc(e.label)}</em></div>`).join('')
    }<div class="tail" style="height:40px;border-bottom:2px solid var(--ink)"></div></div>`;

  const body = PARTS.map(p => {
    const rows = S.singers.filter(s => s.part === p && s.active !== false);
    if (!rows.length) return '';
    return `<div class="sect"><div class="lbl">${esc(t(p))}</div><div class="fill">${esc(t('singersN')(rows.length))}</div></div>` +
      rows.map(s => {
        const cells = ev.map(e => `<div class="cell ${e.kind!=='rehearsal'?'svc':''}">${isAbsent(e.id, s.id) ? esc(S.lang==='en'?'A':'Н') : ''}</div>`).join('');
        const miss = ev.filter(e => isAbsent(e.id, s.id)).length;
        return `<div class="row"><div class="name">${esc(s.name)}</div>
          <div class="tally ${miss>3?'low':''}">${ev.length - miss}/${ev.length}</div>${cells}<div class="tail"></div></div>`;
      }).join('');
  }).join('');

  if (!ev.length) return `<div class="msg">${esc(t('noEvents'))}</div>`;
  return `<div class="scroll"><div class="gwrap">${head}${body}</div></div>
    <div class="legend">
      <span><i style="background:#fff"></i> ${esc(t('present'))}</span>
      <span><i>${S.lang==='en'?'A':'Н'}</i> ${esc(t('absent'))}</span>
      <span><i style="background:#e7ebf5"></i> ${esc(t('service'))}</span>
    </div>
    <div class="legend" style="padding-top:0">${esc(t('labels'))}</div>`;
}
function attendanceSummary(){
  const ev = S.events.filter(e => inRange(e.date, S.sumFrom, S.sumTo));
  if (!ev.length) return `<div class="msg">${esc(t('noEvents'))}</div>`;
  return PARTS.map(p => {
    const rows = S.singers.filter(s => s.part === p && s.active !== false);
    if (!rows.length) return '';
    return `<div class="sectbar">${esc(t(p))}</div>` + rows.map(s => {
      const miss = ev.filter(e => isAbsent(e.id, s.id)).length;
      const pct = Math.round((ev.length - miss) / ev.length * 100);
      return `<div class="li"><div style="width:44%;font-size:15px">${esc(s.name)}</div>
        <div class="bar"><i style="width:${pct}%;background:${pct>=85?'var(--blue)':pct>=70?'var(--gold)':'var(--red)'}"></i></div>
        <div class="pct" style="color:${pct>=70?'var(--ink)':'var(--red)'}">${pct}%</div></div>`;
    }).join('');
  }).join('');
}

function songsByService(){
  const ev = S.events.filter(e => e.kind !== 'rehearsal' && inRange(e.date, S.from, S.to)).slice().reverse();

function songsSummary(){
  const rows = S.songs.map(s => ({ s, st: songStats(s.id) })).sort((a,b) => b.st.n - a.st.n);
  if (!rows.length) return `<div class="msg">${esc(t('noSongs'))}</div>`;

  return `<div class="li" style="background:#fbfbf9;font-size:12px;color:var(--muted)">
      <div style="flex:1">${esc(t('song'))}</div><div style="width:54px;text-align:right">${esc(t('times'))}</div>

/* ---------- render ---------- */
function render(){
  const r = S.route;
  let html = mast();

  if (S.loading) { document.getElementById('app').innerHTML = html + `<div class="msg">${esc(t('loading'))}</div>`; return; }

  if (r.startsWith('#/admin')) {
    if (!S.session) { location.hash = '#/login'; return; }
    const seg = r.split('/');          // #, admin, section, id?
    const section = seg[2] || 'attendance', id = seg[3];
    const ev = id ? S.events.find(e => e.id === id) : null;
    html += publicNav('admin');
    html += `<div class="body">`;
    if (section === 'attendance') html += ev ? markAttendance(ev) : eventPicker('att');
    else if (section === 'songs') html += ev ? markSongs(ev) : eventPicker('songs');
    else if (section === 'songlist') html += manageSongs();
    else html += manageMembers();
    html += `</div>` + adminBar(section === 'attendance' ? 'att' : section === 'songs' ? 'songs'
      : section === 'songlist' ? 'list' : 'members');
  }
  else if (r.startsWith('#/login')) { html += publicNav('') + loginPage(); }
  else if (r.startsWith('#/songs')) {
    const tab = r.split('/')[2] || 'grid';
    html += publicNav('songs') + `<div class="tabs">
      <a href="#/songs/grid" class="${tab==='grid'?'on':''}">${esc(t('grid'))}</a>
      <a href="#/songs/services" class="${tab==='services'?'on':''}">${esc(t('byService'))}</a>
      <a href="#/songs/summary" class="${tab==='summary'?'on':''}">${esc(t('summary'))}</a></div>`;
    if (tab === 'summary') html += rangeCtrl('sum') + songsSummary();
    else if (tab === 'services') html += rangeCtrl('grid') + songsByService();
    else html += `<div class="ctrl"><input class="field" id="q" placeholder="${esc(t('search'))}" value="${esc(S.query)}"></div>`
      + rangeCtrl('grid') + songsGrid();
  }
  else {
    const tab = r.split('/')[2] || 'grid';
    html += publicNav('att') + `<div class="tabs">
      <a href="#/attendance/grid" class="${tab==='grid'?'on':''}">${esc(t('grid'))}</a>
      <a href="#/attendance/summary" class="${tab==='summary'?'on':''}">${esc(t('summary'))}</a></div>`;
    if (tab === 'summary') html += rangeCtrl('sum') + attendanceSummary();
    else html += rangeCtrl('grid') + `<div class="ctrl"><div class="seg">
        ${[['all','all'],['services','services'],['rehearsals','rehearsals']].map(([v,l]) =>
          `<button data-type="${v}" class="${S.typeFilter===v?'on':''}">${esc(t(l))}</button>`).join('')}
      </div></div>` + attendanceGrid();
  }
  document.getElementById('app').innerHTML = html;
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-lang],[data-preset],[data-type],[data-kind],[data-go],[data-toggle-absent],[data-toggle-song],[data-add-song],[data-del-song],[data-edit-song],[data-add-singer],[data-del-singer],[data-edit-singer],[data-login],[data-signout]');
  if (!el) return;
  const d = el.dataset;

  if (d.lang) { S.lang = d.lang; localStorage.setItem('bsebc-lang', d.lang); return render(); }

  if (d.preset) {
    const months = d.preset === 'all' ? 600 : +d.preset;
    if (d.range === 'sum') { S.sumFrom = shift(months); S.sumTo = today(); }
    else { S.from = shift(months); S.to = today(); }
    return render();
  }
  if (d.type) { S.typeFilter = d.type; return render(); }
  if (d.kind) { S.draft.kind = d.kind; return render(); }

  if (d.go) {
    const dateEl = document.getElementById('draft-date');
    S.draft.date = dateEl ? dateEl.value : S.draft.date;
    const nameEl = document.getElementById('draft-name'), labEl = document.getElementById('draft-label');
    if (nameEl) S.draft.name = nameEl.value;
    if (labEl) S.draft.label = labEl.value;
    const label = S.draft.kind === 'other'
      ? (S.draft.label || (S.draft.name || '?').slice(0,2)) : KIND_LABEL[S.lang][S.draft.kind];
    const row = { date: S.draft.date, kind: S.draft.kind, label, name: S.draft.kind === 'other' ? S.draft.name : null };
    let ev = S.events.find(x => x.date === row.date && x.kind === row.kind && (x.name || '') === (row.name || ''));
    if (!ev) {
      const { data, error } = await sb.from('events').insert(row).select().single();
      if (error) { S.error = error.message; return render(); }
      ev = data; S.events.push(ev); S.events.sort((a,b) => a.date < b.date ? -1 : 1);
    }
    location.hash = '#/admin/' + (d.go === 'att' ? 'attendance' : 'songs') + '/' + ev.id;
    return;
  }

  if (d.toggleAbsent) {
    const on = isAbsent(d.event, d.toggleAbsent);
    if (on) { S.absences = S.absences.filter(a => !(a.event_id === d.event && a.singer_id === d.toggleAbsent));
      render(); await sb.from('absences').delete().match({ event_id: d.event, singer_id: d.toggleAbsent }); }
    else { S.absences.push({ event_id: d.event, singer_id: d.toggleAbsent });
      render(); await sb.from('absences').insert({ event_id: d.event, singer_id: d.toggleAbsent }); }
    return;
  }
  if (d.toggleSong) {
    const on = wasSung(d.event, d.toggleSong);
    if (on) { S.eventSongs = S.eventSongs.filter(x => !(x.event_id === d.event && x.song_id === d.toggleSong));
      render(); await sb.from('event_songs').delete().match({ event_id: d.event, song_id: d.toggleSong }); }
    else { S.eventSongs.push({ event_id: d.event, song_id: d.toggleSong });
      render(); await sb.from('event_songs').insert({ event_id: d.event, song_id: d.toggleSong }); }
    return;
  }

  if (d.addSong !== undefined && el.hasAttribute('data-add-song')) {
    const title = document.getElementById('new-song-title').value.trim();
    if (!title) return;
    const subtitle = document.getElementById('new-song-sub').value.trim() || null;
    const { data, error } = await sb.from('songs').insert({ title, subtitle }).select().single();
    if (error) { S.error = error.message; return render(); }
    S.songs.push(data); S.songs.sort((a,b) => a.title.localeCompare(b.title)); return render();
  }
  if (d.editSong) {
    const s = S.songs.find(x => x.id === d.editSong);
    const title = prompt(t('renameSong'), s.title); if (title === null) return;
    const subtitle = prompt(t('subtitle'), s.subtitle || '');
    await sb.from('songs').update({ title, subtitle: subtitle || null }).eq('id', s.id);
    s.title = title; s.subtitle = subtitle || null; return render();
  }
  if (d.delSong) {
    if (!confirm(t('deleteSong'))) return;
    await sb.from('songs').delete().eq('id', d.delSong);
    S.songs = S.songs.filter(x => x.id !== d.delSong); return render();
  }
  if (el.hasAttribute('data-add-singer')) {
    const name = document.getElementById('new-singer-name').value.trim();
    if (!name) return;
    const part = document.getElementById('new-singer-part').value;
    const { data, error } = await sb.from('singers').insert({ name, part }).select().single();
    if (error) { S.error = error.message; return render(); }
    S.singers.push(data); return render();
  }
  if (d.editSinger) {
    const s = S.singers.find(x => x.id === d.editSinger);
    const name = prompt(t('renameSinger'), s.name); if (name === null) return;
    await sb.from('singers').update({ name }).eq('id', s.id);
    s.name = name; return render();
  }
  if (d.delSinger) {
    if (!confirm(t('deleteSinger'))) return;
    await sb.from('singers').delete().eq('id', d.delSinger);
    S.singers = S.singers.filter(x => x.id !== d.delSinger); return render();
  }

  if (el.hasAttribute('data-login')) {
    const email = document.getElementById('em').value.trim();
    const password = document.getElementById('pw').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { S.error = error.message; return render(); }
    S.session = data.session; S.error = ''; location.hash = '#/admin/attendance'; return;
  }
  if (el.hasAttribute('data-signout')) { await sb.auth.signOut(); S.session = null; location.hash = '#/attendance'; return; }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.range) {
    const v = el.value;
    if (el.dataset.range === 'sum') { if (el.dataset.edge === 'from') S.sumFrom = v; else S.sumTo = v; }
    else { if (el.dataset.edge === 'from') S.from = v; else S.to = v; }
    render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    S.query = e.target.value;
    const pos = e.target.selectionStart; render();
    const again = document.getElementById('q'); if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  }
});
window.addEventListener('hashchange', () => { S.route = location.hash || '#/attendance'; S.error = ''; render(); });

/* ---------- boot ---------- */
S.from = shift(2); S.to = today(); S.sumFrom = shift(6); S.sumTo = today();
const { data: { session } } = await sb.auth.getSession();
S.session = session;
sb.auth.onAuthStateChange((_e, s) => { S.session = s; render(); });
await load();
</script>
</body>
</html>
