name: Keep Supabase awake

# Free-tier Supabase projects pause after 7 days with no API requests.
# This makes one tiny read every Monday so that never happens.

on:
  schedule:
    - cron: '0 12 * * 1'      # Mondays, 12:00 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/songs?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
